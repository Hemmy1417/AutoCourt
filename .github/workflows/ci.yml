name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: genvm-lint + direct suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest genvm-linter
      # The pinned Studio Next runner is what ships; genvm-lint's AST
      # `lint` checks the source without needing the runner bundle.
      - name: genvm-lint (AST)
        run: PYTHONUTF8=1 genvm-lint lint contracts/autocourt_assessment.py --json
      - name: direct suite
        run: PYTHONUTF8=1 python -m pytest tests/direct -q

  web:
    name: web app (the build Vercel runs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (the exact check Vercel runs)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm run test
      - name: One address in every surface
        run: npm run verify
      - name: Build
        run: npm run build
